# Experiment book #5 — 15m MR + trail + DAILY CIRCUIT BREAKER.
#
# (Repurposed 2026-08-08. This book's first six weeks A/B-tested the adaptive
# narrowing trail; the verdict was clear and negative: it converted ~12 would-be
# completed reversions (avg +$850) into early trail-locks (avg +$417), finishing
# ~$9k behind the constant-trail book on identical entries. Experiment concluded
# — the tightening cuts winners just before the mean.)
#
# Now the single-variable A/B for the circuit breaker: identical to the
# constant-trail book (config_experiment_trail.yaml) PLUS max_daily_stops — after
# 2 same-direction hard stops in a session, no more entries that direction until
# tomorrow. On a replay of six weeks of live trades this rule added +$7-9k per
# book by halting the reversal-day stop-out -> re-enter cascades (blocked
# entries go to the shadow book, so its cost stays measurable).
#
#   python3 scripts/run_bot.py --config config_experiment_adaptive.yaml --state-dir state_experiment_adaptive

name: "Experiment — 15m MR + trail + breaker"

account:
  starting_equity: 100000.0
  risk_per_trade: 0.01
  max_daily_stops: 2

schedule:
  timezone: "America/New_York"
  morning_report: "07:00"
  evening_report: "21:00"
  poll_interval_minutes: 5

correlation:
  groups:
    equity: [SPY, QQQ, IWM, DIA, XLK]
  max_same_direction_per_group: 2

data:
  source: yfinance
  cache_dir: state_experiment_adaptive/data_cache
  cache_ttl_minutes: 1440

costs:
  friction_bps: 3.0

# Same entries + constant trail as config_experiment_trail.yaml — the ONLY
# difference vs that book is account.max_daily_stops above, so the pair is a
# clean single-variable breaker A/B. (trail_near_mult removed: the adaptive
# narrowing lost ~$9k vs this constant trail on identical entries.)
instruments:
  SPY:
    symbol: "SPY"
    name: "S&P 500 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trail_atr_mult: 3.0}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5], trail_atr_mult: [2.0, 5.0]}

  QQQ:
    symbol: "QQQ"
    name: "Nasdaq 100 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trail_atr_mult: 3.0}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5], trail_atr_mult: [2.0, 5.0]}

  IWM:
    symbol: "IWM"
    name: "Russell 2000 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trail_atr_mult: 3.0}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5], trail_atr_mult: [2.0, 5.0]}

  DIA:
    symbol: "DIA"
    name: "Dow Jones ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trail_atr_mult: 3.0}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5], trail_atr_mult: [2.0, 5.0]}

  XLK:
    symbol: "XLK"
    name: "Technology Sector ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trail_atr_mult: 3.0}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5], trail_atr_mult: [2.0, 5.0]}
