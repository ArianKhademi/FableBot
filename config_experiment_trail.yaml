# Experiment book #3 — identical to config_experiment.yaml (15m mean-reversion
# across the same ETFs, fresh $100k) EXCEPT the positions trail their stop. Run
# it alongside the no-trail experiment for a clean A/B: same instruments, same
# entries, the only difference is whether the stop trails. Compare the two
# dashboards over time.
#
#   python3 scripts/run_bot.py --config config_experiment_trail.yaml --state-dir state_experiment_trail
#
# (The engine search already explores trailing on its own; this is the live
# forward-test version so you can watch it on a dashboard.)

name: "Experiment — 15m MR + trailing stop"

account:
  starting_equity: 100000.0
  risk_per_trade: 0.01

schedule:
  timezone: "America/New_York"
  morning_report: "07:00"
  evening_report: "21:00"
  poll_interval_minutes: 5

correlation:
  groups:
    equity: [SPY, QQQ, IWM, DIA, XLK]
  max_same_direction_per_group: 2

data:
  source: yfinance
  cache_dir: state_experiment_trail/data_cache
  cache_ttl_minutes: 1440

costs:
  friction_bps: 3.0

# Same mean-reversion entries as config_experiment.yaml, but trail_atr_mult is set
# so the broker ratchets the stop toward price as the trade reverts (locking
# profit; stops only ever tighten).
instruments:
  SPY:
    symbol: "SPY"
    name: "S&P 500 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trail_atr_mult: 3.0}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5], trail_atr_mult: [2.0, 5.0]}

  QQQ:
    symbol: "QQQ"
    name: "Nasdaq 100 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trail_atr_mult: 3.0}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5], trail_atr_mult: [2.0, 5.0]}

  IWM:
    symbol: "IWM"
    name: "Russell 2000 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trail_atr_mult: 3.0}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5], trail_atr_mult: [2.0, 5.0]}

  DIA:
    symbol: "DIA"
    name: "Dow Jones ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trail_atr_mult: 3.0}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5], trail_atr_mult: [2.0, 5.0]}

  XLK:
    symbol: "XLK"
    name: "Technology Sector ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trail_atr_mult: 3.0}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5], trail_atr_mult: [2.0, 5.0]}
