account:
  starting_equity: 100000.0
  # Hard per-trade risk budget: every trade risks exactly this fraction of
  # equity. The stop is priced so hitting it loses this much, no exceptions.
  risk_per_trade: 0.01

schedule:
  timezone: "America/New_York"
  morning_report: "07:00"
  evening_report: "21:00"
  poll_interval_minutes: 5

correlation:
  # If max_same_direction_per_group positions in a group are already open in
  # one direction, new entries in that direction are blocked.
  groups:
    risk_on: [SPX, NDX, BTC]
  max_same_direction_per_group: 2

data:
  # Which OHLCVSource the optimizer/evolver fetch from, and the on-disk cache.
  # yfinance | stooq (deep daily) | binance (deep intraday crypto).
  source: yfinance
  cache_dir: state/data_cache
  cache_ttl_minutes: 1440

universe:
  # A large, config-driven scan list for the genome search (scripts/evolve.py
  # --universe). Any genome can be tried on any symbol, so the search discovers
  # which symbols are worth trading — separate from the few traded below.
  # Add tickers freely; no code change required.
  default_timeframe: "1d"
  default_strategy: trend_following
  symbols:
    - {symbol: SPY,  name: "S&P 500 ETF"}
    - {symbol: QQQ,  name: "Nasdaq 100 ETF"}
    - {symbol: IWM,  name: "Russell 2000 ETF"}
    - {symbol: DIA,  name: "Dow Jones ETF"}
    - {symbol: GLD,  name: "Gold ETF"}
    - {symbol: SLV,  name: "Silver ETF"}
    - {symbol: USO,  name: "US Oil Fund"}
    - {symbol: TLT,  name: "20Y Treasury ETF"}
    - {symbol: XLE,  name: "Energy Sector"}
    - {symbol: XLF,  name: "Financials Sector"}
    - {symbol: XLK,  name: "Technology Sector"}
    - {symbol: AAPL, name: "Apple"}
    - {symbol: MSFT, name: "Microsoft"}
    - {symbol: NVDA, name: "NVIDIA"}
    - {symbol: AMZN, name: "Amazon"}
    - {symbol: BTC-USD, name: "Bitcoin", source: binance}
    - {symbol: ETH-USD, name: "Ethereum", source: binance}

instruments:
  SPX:
    symbol: "^GSPC"
    name: "S&P 500"
    strategy: mean_reversion
    # Daily, not 15m. On 15m the Sharpe estimate is noise-dominated (the whole
    # reason nothing validated), and yfinance serves only ~60 days of it. Daily
    # gives decades across many regimes, so the held-out gate is meaningful — and
    # short-horizon mean-reversion ("buy the dip") is a real effect on the daily
    # S&P. lookback=20 is now 20 days, a sensible dip-buy window.
    timeframe: "1d"
    params:
      lookback: 20
      entry_z: 2.0
      exit_z: 0.5
      atr_period: 14
      atr_stop_mult: 2.0
    param_bounds:
      lookback: [10, 40]
      entry_z: [1.5, 3.0]
      exit_z: [0.2, 1.0]
      atr_stop_mult: [1.5, 3.5]

  NDX:
    symbol: "^IXIC"
    name: "Nasdaq Composite"
    strategy: mean_reversion
    # Left on 15m for now because it has an open paper position — changing its
    # timeframe mid-trade would orphan that position. Move it to 1d (like SPX)
    # once the position closes.
    timeframe: "15m"
    params:
      lookback: 20
      entry_z: 2.0
      exit_z: 0.5
      atr_period: 14
      atr_stop_mult: 2.0
    param_bounds:
      lookback: [10, 40]
      entry_z: [1.5, 3.0]
      exit_z: [0.2, 1.0]
      atr_stop_mult: [1.5, 3.5]

  BTC:
    symbol: "BTC-USD"
    name: "Bitcoin"
    # Crypto pulls free, deep intraday history from Binance (BTC-USD -> BTCUSDT);
    # news/display stay on the Yahoo symbol.
    source: binance
    strategy: momentum_breakout
    timeframe: "1h"
    params:
      entry_channel: 20
      exit_channel: 10
      atr_period: 14
      atr_stop_mult: 2.5
      trail_atr_mult: 2.5
    param_bounds:
      entry_channel: [10, 40]
      exit_channel: [5, 20]
      atr_stop_mult: [1.5, 4.0]
      trail_atr_mult: [1.5, 4.0]

  GOLD:
    symbol: "GC=F"
    name: "Gold"
    strategy: trend_following
    timeframe: "4h"
    params:
      fast_ema: 20
      slow_ema: 50
      atr_period: 14
      atr_stop_mult: 3.0
      trail_atr_mult: 3.0
    param_bounds:
      fast_ema: [10, 30]
      slow_ema: [30, 80]
      atr_stop_mult: [2.0, 5.0]
      trail_atr_mult: [2.0, 5.0]

  OIL:
    symbol: "CL=F"
    name: "Crude Oil"
    strategy: trend_following
    timeframe: "4h"
    params:
      fast_ema: 20
      slow_ema: 50
      atr_period: 14
      atr_stop_mult: 3.0
      trail_atr_mult: 3.0
    param_bounds:
      fast_ema: [10, 30]
      slow_ema: [30, 80]
      atr_stop_mult: [2.0, 5.0]
      trail_atr_mult: [2.0, 5.0]
