# Experiment book #6 — 15m mean-reversion with a SHORTS-ONLY trend filter.
#
# trend_filter_ma + trend_filter_side: shorts — the strategy won't short while
# price is above its trend_filter_ma-bar average (never fade the up-drift), but it
# still buys every oversold dip. This is the "keep the upside AND cut the losses"
# variant: it removes the counter-trend shorts that stacked up on the 06-30 rally
# while keeping all the dip-buying that drives MR's returns.
#
#   python3 scripts/run_bot.py --config config_experiment_trendfilter.yaml --state-dir state_experiment_trendfilter
#
# Evidence (15 years daily): shorts-only BEAT unfiltered return while ~halving
# drawdown — SPY +19.1%/DD11 -> +25.8%/DD6, QQQ +13.5%/DD8 -> +25.8%/DD5. The
# symmetric filter (trend_filter_side: both) instead trades upside for robustness:
# it also blocks longs in a downtrend, so it protects in a bear but earns less in a
# bull. Shorts-only is a bet that equities keep drifting up (no bear-market brake);
# switch to `both` if you want the all-weather version.
#
# NOTE: MA200 on 15m is only ~2 trading days of trend (the 15m feed can't see
# further). The validated horizon is the *daily* 200-MA — the multi-timeframe
# version (gate 15m entries by the daily trend) is the follow-up; this is the
# same-series first cut.

name: "Experiment — 15m MR + trend filter"

account:
  starting_equity: 100000.0
  risk_per_trade: 0.01

schedule:
  timezone: "America/New_York"
  morning_report: "07:00"
  evening_report: "21:00"
  poll_interval_minutes: 5

correlation:
  groups:
    equity: [SPY, QQQ, IWM, DIA, XLK]
  max_same_direction_per_group: 2

data:
  source: yfinance
  cache_dir: state_experiment_trendfilter/data_cache
  cache_ttl_minutes: 1440

costs:
  friction_bps: 3.0

# Same mean-reversion entries as config_experiment.yaml, plus trend_filter_ma:
# skip fades that fight the ~200-bar trend.
instruments:
  SPY:
    symbol: "SPY"
    name: "S&P 500 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trend_filter_ma: 200, trend_filter_side: shorts}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5]}

  QQQ:
    symbol: "QQQ"
    name: "Nasdaq 100 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trend_filter_ma: 200, trend_filter_side: shorts}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5]}

  IWM:
    symbol: "IWM"
    name: "Russell 2000 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trend_filter_ma: 200, trend_filter_side: shorts}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5]}

  DIA:
    symbol: "DIA"
    name: "Dow Jones ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trend_filter_ma: 200, trend_filter_side: shorts}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5]}

  XLK:
    symbol: "XLK"
    name: "Technology Sector ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trend_filter_ma: 200, trend_filter_side: shorts}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5]}
