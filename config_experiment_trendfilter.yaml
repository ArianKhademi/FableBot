# Experiment book #6 — 15m mean-reversion with a SYMMETRIC trend filter.
#
# trend_filter_ma + trend_filter_side: both — never fade AGAINST the ~200-bar
# trend either way: no shorts while price is above the trend MA, no longs while
# below it. This is the regime-ROBUST version — it protects in both a bull and a
# bear, at the cost of some upside in a calm bull.
#
#   python3 scripts/run_bot.py --config config_experiment_trendfilter.yaml --state-dir state_experiment_trendfilter
#
# Evidence (15 years daily): held returns ~flat while ~halving max drawdown and
# lifting win rate (SPY +19.1%/DD11 -> +18.1%/DD5, QQQ +13.5%/DD8 -> +15.2%/DD6).
# Book #7 (config_experiment_trendfilter_shorts.yaml) runs the SHORTS-ONLY variant
# — earns more in a bull but gives up the bear brake. Run both to A/B the
# robust-vs-keep-upside trade-off.
#
# NOTE: MA200 on 15m is only ~2 trading days of trend (the 15m feed can't see
# further). The validated horizon is the *daily* 200-MA — the multi-timeframe
# version is the follow-up; this is the same-series first cut.

name: "Experiment — 15m MR + trend filter"

account:
  starting_equity: 100000.0
  risk_per_trade: 0.01

schedule:
  timezone: "America/New_York"
  morning_report: "07:00"
  evening_report: "21:00"
  poll_interval_minutes: 5

correlation:
  groups:
    equity: [SPY, QQQ, IWM, DIA, XLK]
  max_same_direction_per_group: 2

data:
  source: yfinance
  cache_dir: state_experiment_trendfilter/data_cache
  cache_ttl_minutes: 1440

costs:
  friction_bps: 3.0

# Same mean-reversion entries as config_experiment.yaml, plus trend_filter_ma:
# skip fades that fight the ~200-bar trend.
instruments:
  SPY:
    symbol: "SPY"
    name: "S&P 500 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trend_filter_ma: 200, trend_filter_side: both}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5]}

  QQQ:
    symbol: "QQQ"
    name: "Nasdaq 100 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trend_filter_ma: 200, trend_filter_side: both}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5]}

  IWM:
    symbol: "IWM"
    name: "Russell 2000 ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trend_filter_ma: 200, trend_filter_side: both}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5]}

  DIA:
    symbol: "DIA"
    name: "Dow Jones ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trend_filter_ma: 200, trend_filter_side: both}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5]}

  XLK:
    symbol: "XLK"
    name: "Technology Sector ETF"
    strategy: mean_reversion
    timeframe: "15m"
    params: {lookback: 20, entry_z: 2.0, exit_z: 0.5, atr_period: 14, atr_stop_mult: 2.0, trend_filter_ma: 200, trend_filter_side: both}
    param_bounds: {lookback: [10, 40], entry_z: [1.5, 3.0], exit_z: [0.2, 1.0], atr_stop_mult: [1.5, 3.5]}
